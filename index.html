<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>阿飯餵飯糰，散步地圖</title>
<link rel="icon" href="sprites/onigiri.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <header class="hud">
    <div class="hud-row">
      <h1 class="title"><img src="sprites/onigiri.png" alt="">阿飯餵飯糰</h1>
      <span class="ver">第四版之二</span>
      <span id="bonus" class="bonus" title="點小物每天各拿一次">小飯糰 0</span>
      <button id="reset" class="btn" type="button">重新開始</button>
    </div>
    <div id="stages" class="stages" aria-label="關卡進度"></div>
  </header>
  <main id="stage" class="stage">
    <canvas id="scene" aria-label="散步地圖，點路面讓阿飯走過去，拖曳可捲動"></canvas>
    <p id="toast" class="toast" aria-live="polite">點一下小路，阿飯就會沿著路走過去，左右拖曳可以看看風景</p>
  </main>

  <div id="harvest" class="overlay" role="dialog" aria-modal="true" aria-label="接稻穗小遊戲" hidden>
    <div class="h-hud">
      <span id="h-label">作品編號 01</span>
      <span id="h-timer">剩餘 10 秒</span>
      <span id="h-score">已收 0 束</span>
      <button id="h-skip" class="btn" type="button">跳過</button>
    </div>
    <p id="h-hint" class="h-hint">左右拖曳阿飯接住稻穗，金色稻穗加三束還能做成黃金飯糰</p>
    <div id="h-field" class="h-field">
      <div id="h-items"></div>
      <div id="h-birds"></div>
      <div id="h-afan" class="h-afan"><img id="h-afan-img" src="scroll/afan/walk_1.png" alt="阿飯" draggable="false"></div>
    </div>
    <div id="h-result" class="h-result" hidden></div>
  </div>

  <div id="mini" class="overlay" role="dialog" aria-modal="true" aria-label="立牌小互動" hidden>
    <div class="h-hud">
      <span id="m-label">作品編號 01</span>
      <span id="m-title">翻翻立牌</span>
      <button id="m-skip" class="btn" type="button">跳過</button>
    </div>
    <p id="m-hint" class="h-hint"></p>
    <div id="m-play" class="m-play"></div>
    <div id="m-result" class="h-result" hidden></div>
  </div>

  <div id="card" class="overlay card-wrap" role="dialog" aria-modal="true" aria-label="收稻卡" hidden>
    <div class="card">
      <img src="sprites/rice_golden.png" alt="" class="card-rice">
      <h2>收稻卡</h2>
      <p class="card-sub">阿飯走完了入村，棚田，遠山三段小路</p>
      <ul id="card-list" class="card-list"></ul>
      <p id="card-date" class="card-date"></p>
      <button id="card-close" class="btn btn-gold" type="button">收下收稻卡</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
